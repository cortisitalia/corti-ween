const cv=$('#noise'),cx=cv.getContext('2d');cv.width=200;cv.height=120;
const im=cx.createImageData(200,120);let last=0;
(function loop(t){if(t-last>70){const d=im.data;for(let i=0;i<d.length;i+=4){d[i]=d[i+1]=d[i+2]=Math.random()*255;d[i+3]=255}cx.putImageData(im,0,0);last=t}requestAnimationFrame(loop)})(0);

let ac,master,muted=false;
function unlockIOS(){try{navigator.audioSession&&(navigator.audioSession.type='playback')}catch(e){}
 try{const sr=8000,n=sr/2,buf=new ArrayBuffer(44+n),v=new DataView(buf);const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
 w(0,'RIFF');v.setUint32(4,36+n,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr,true);v.setUint16(32,1,true);v.setUint16(34,8,true);w(36,'data');v.setUint32(40,n,true);
 for(let i=0;i<n;i++)v.setUint8(44+i,128);const a=new Audio(URL.createObjectURL(new Blob([buf],{type:'audio/wav'})));a.loop=true;a.setAttribute('playsinline','');a.play().catch(()=>{});window._sil=a}catch(e){}}
['pointerdown','touchend','click','keydown'].forEach(ev=>addEventListener(ev,()=>{if(ac&&ac.state!=='running')ac.resume()},true));
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&ac&&ac.state!=='running')ac.resume()});
function initAudio(){try{ac=new(window.AudioContext||window.webkitAudioContext)();unlockIOS();ac.resume&&ac.resume();master=ac.createGain();master.gain.value=.8;master.connect(ac.destination);
 const o=ac.createOscillator(),g=ac.createGain();o.type='sawtooth';o.frequency.value=47;g.gain.value=.012;o.connect(g);g.connect(master);o.start()}catch(e){}}
function burst(d,v,lpf,t0){if(!ac)return;const k=ac.sampleRate*d,b=ac.createBuffer(1,k,ac.sampleRate),a=b.getChannelData(0);for(let i=0;i<k;i++)a[i]=Math.random()*2-1;
 const so=ac.createBufferSource(),g=ac.createGain(),t=ac.currentTime+(t0||0);so.buffer=b;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
 let nd=so;if(lpf){const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=lpf;so.connect(f);nd=f}nd.connect(g);g.connect(master);so.start(t)}
function tone(w,f0,f1,t0,dur,vol){if(!ac)return;const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+t0;o.type=w;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);
 g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.05)}
function nz(d,v,type,f,q,t0){if(!ac)return;const k=ac.sampleRate*d,b=ac.createBuffer(1,k,ac.sampleRate),a=b.getChannelData(0);for(let i=0;i<k;i++)a[i]=Math.random()*2-1;
 const so=ac.createBufferSource(),fl=ac.createBiquadFilter(),g=ac.createGain(),t=ac.currentTime+(t0||0);so.buffer=b;fl.type=type;fl.frequency.value=f;fl.Q.value=q;
 g.gain.setValueAtTime(.001,t);g.gain.linearRampToValueAtTime(v,t+d*.4);g.gain.exponentialRampToValueAtTime(.001,t+d);so.connect(fl);fl.connect(g);g.connect(master);so.start(t)}
function scream(){burst(.9,1);[90,133,201].forEach((f,i)=>tone('sawtooth',f,f*5,0,.8,.35-i*.08))}
$('#mute').onclick=e=>{muted=!muted;if(master)master.gain.value=muted?0:.8;e.target.textContent='audio: '+(muted?'off':'on')};

const FACE=`<svg viewBox="0 0 200 200" preserveAspectRatio="xMidYMid slice"><rect width="200" height="200" fill="#000"/><path d="M30 200C30 120 50 30 100 30s70 90 70 170z" fill="#0b0b0b"/><ellipse cx="100" cy="100" rx="46" ry="62" fill="#d7ddd5"/><ellipse cx="80" cy="88" rx="13" ry="20" fill="#000"/><ellipse cx="120" cy="88" rx="13" ry="20" fill="#000"/><circle cx="80" cy="92" r="2.5" fill="#fff"/><circle cx="120" cy="92" r="2.5" fill="#fff"/><path d="M100 98l-4 20h8z" fill="#9aa39b"/><ellipse cx="100" cy="146" rx="19" ry="26" fill="#000"/></svg>`;
const FX={

 lights(){document.body.classList.remove('dark');flash(.5);tone('square',90,60,0,.25,.5);burst(.2,.4,500)},
 ring(){[0,1.3,2.6].forEach(r=>{for(let k=0;k<9;k++)tone('square',k%2?480:440,k%2?480:440,r+k*.055,.05,.12)})},
 scare(){const el=$('#scare');el.innerHTML=FACE;el.classList.add('on');scream();document.body.classList.add('shake');navigator.vibrate&&navigator.vibrate([200,80,300]);
  setTimeout(()=>{el.classList.remove('on');el.innerHTML='';document.body.classList.remove('shake')},950)}
};

const slots={l:{el:$('#sl'),key:null},r:{el:$('#sr'),key:null}};
function setSlot(side,key){const sl=slots[side];if(sl.key===key)return;sl.key=key;sl.el.innerHTML='';
 if(!key){sl.el.classList.remove('show');return}
 const c=CAST[key],i=new Image();i.alt=c.name;i.onerror=()=>{sl.el.innerHTML='<div class="ini">'+c.name[0]+'</div>'};i.src=c.img;sl.el.appendChild(i);
 sl.el.classList.remove('show');void sl.el.offsetWidth;sl.el.classList.add('show')}
function stageFor(key){['l','r'].forEach(x=>slots[x].el.classList.remove('dim','focus'));
 if(key){const side=CAST[key].side;setSlot(side,key);slots[side].el.classList.add('focus');slots[side==='l'?'r':'l'].el.classList.add('dim')}
 else['l','r'].forEach(x=>slots[x].el.classList.add('dim'))}
const clearStage=()=>{setSlot('l',null);setSlot('r',null)};

const box=$('#box'),txt=$('#txt'),nameEl=$('#name'),arrow=$('#arrow'),cardEl=$('#card'),opts=$('#opts');
let idx=0,typing=false,timer=null,started=false,ended=false,full='',picked=false,chapN=0;
const NAMES={tu:"TU",voce:"VOCE"};
function finishTyping(){clearTimeout(timer);typing=false;txt.textContent=full;arrow.classList.add('on')}
function typeText(str,pitch,wave){clearTimeout(timer);full=str;arrow.classList.remove('on');
 if(reduce){typing=false;txt.textContent=str;arrow.classList.add('on');return}
 typing=true;let i=0;txt.textContent='';
 (function t(){i++;txt.textContent=str.slice(0,i);if(pitch&&i%3===0&&str[i-1]!==' ')tone(wave||'square',pitch,pitch*.9,0,.03,.03);
  if(i<str.length)timer=setTimeout(t,20+Math.random()*28);else{typing=false;arrow.classList.add('on')}})()}
const tmEl=$('#tm'),tmI=tmEl.firstChild;let tmT=null;
function stopTm(){clearTimeout(tmT);tmEl.style.display='none'}
function startTm(ms,fn){tmEl.style.display='block';tmI.style.transition='none';tmI.style.width='100%';void tmI.offsetWidth;tmI.style.transition='width '+ms+'ms linear';tmI.style.width='0';tmT=setTimeout(fn,ms);FX.heart()}
function render(i){stopTm();
 const L=S[i];idx=i;$('#prog').style.width=(i/(S.length-1)*100)+'%';opts.innerHTML='';
 if(L.card){chapN++;setBg(L.bg);$('#clock').textContent=L.time;$('#chap').textContent='EP.5 · CAPITOLO '+chapN+'/5';
  box.classList.add('hide');cardEl.classList.add('on');$('#ct').textContent=L.time;$('#cs').textContent=L.sub;clearStage();if(L.l)setSlot('l',L.l);if(L.r)setSlot('r',L.r);stageFor(null);clearTimeout(timer);typing=false;blip();return}
 cardEl.classList.remove('on');box.classList.remove('hide');box.className=L.w;picked=false;if(L.bg)setBg(L.bg);
 nameEl.textContent=CAST[L.w]?CAST[L.w].name.toUpperCase():(NAMES[L.w]||'');
 if(CAST[L.w])stageFor(L.w);else if(L.w==='n'){const m=L.t.match(/^(Martin|James|Juhoon|Seonghyeon|Keonho)\b/);stageFor(m?m[1].toLowerCase():null)}else stageFor(null);
 typeText(L.t,CAST[L.w]?CAST[L.w].pitch:(L.w==='tu'?330:L.w==='voce'?70:0),L.w==='voce'?'sawtooth':'square');
 if(L.fx&&FX[L.fx])FX[L.fx]();
 if(L.timed)startTm(20000,()=>pick('A',true));
 if(L.ch)L.ch.forEach(([k,t,d])=>{const b=document.createElement('button');b.className='opt';b.innerHTML='<b>'+k+' — '+t+'</b><span>'+d+'</span>';b.onclick=()=>pick(k);opts.appendChild(b)});
}
function pick(k,late){if(picked)return;picked=true;stopTm();clearTimeout(timer);typing=false;SAVE('ep5',k);tone('square',880,880,0,.08,.2);EN=ending(k);fin(EN);S.splice(idx+1,0,...BR[k],...END[EN]);blip();render(idx+1)}
function next(){if(typing){finishTyping();return}
 if(S[idx].ch&&!picked)return;
 if(idx>=S.length-1){showEnd();return}render(idx+1)}
function showEnd(){ended=true;if(FX.sting)FX.sting();SAVE('ep5done',1);document.body.classList.remove('dark');$('#end').classList.add('on');box.classList.add('hide');$('#prog').style.width='100%'}
document.addEventListener('click',e=>{if(!started||ended||e.target.closest('button,a'))return;next()});
